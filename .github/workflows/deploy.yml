name: Deploy

# Zero-touch deploys on every push to main. Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Pages:Edit, Durable Objects)
# and CLOUDFLARE_ACCOUNT_ID. Without them the job explains what's missing
# and skips cleanly.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.ok == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.creds.outputs.ok == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.creds.outputs.ok == 'true'
        with:
          tool: wasm-pack
      - name: Install worker-build
        if: steps.creds.outputs.ok == 'true'
        run: command -v worker-build || cargo install worker-build --locked
      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ok == 'true'
      - name: Build web
        if: steps.creds.outputs.ok == 'true'
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run wasm
          bun run build:site
      - name: Deploy rooms Worker (Rust Durable Object)
        if: steps.creds.outputs.ok == 'true' && hashFiles('crates/rooms/wrangler.toml') != ''
        working-directory: crates/rooms
        run: bunx wrangler@4 deploy
      - name: Deploy Pages site
        if: steps.creds.outputs.ok == 'true'
        working-directory: web
        run: |
          bunx wrangler@4 pages project create playcubes --production-branch main 2>/dev/null || true
          bunx wrangler@4 pages deploy dist --project-name playcubes --branch main --commit-dirty=true
