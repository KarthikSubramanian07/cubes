[workspace]
resolver = "2"
members = ["crates/engine", "crates/wasm", "crates/rooms"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Karthik Subramanian <winnerkarthik07@gmail.com>"]
repository = "https://github.com/KarthikSubramanian07/cubes"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
